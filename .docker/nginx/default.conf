server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les add_header d'un bloc location remplacent ceux du serveur : en-têtes communs inclus dans chaque bloc.

    # Assets générés par Vite : nom hashé, cache long
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
