# Prod locale : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# La version publique reste GitHub Pages ; cette image sert à vérifier le build.
services:
  app:
    profiles: ['dev']

  web:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/}
    image: colagan-configurator-web:local
    ports:
      - '127.0.0.1:${PROD_PORT:-8080}:80'
    restart: unless-stopped
